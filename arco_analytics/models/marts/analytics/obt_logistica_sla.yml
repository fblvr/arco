version: 2
models:
- name: obt_logistica_sla
  description: Painel Tático de Logística. Permite o CD investigar granularmente cada
    entrega e seu status de SLA.
  columns:
  - name: id_entrega
    description: Tracking ID.
    tests:
    - unique
    - not_null
  - name: id_cliente
    description: CNPJ destino.
  - name: nome_escola
    description: Nome fantasia destino.
    meta:
      contains_pii: true
      classification: Restricted
  - name: is_atrasado
    description: Flag booleana se a entrega superou a data prometida.
  meta:
    summary: 'Modelo de dados para obt_logistica_sla'
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
    aggregation_logic: Agregação executiva (One Big Table) consolidando métricas por
      escola/entrega.
