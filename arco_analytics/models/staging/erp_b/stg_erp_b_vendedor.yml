version: 2
models:
- name: stg_erp_b_vendedor
  description: Modelo staging da tabela stg_erp_b_vendedor. Contém limpeza de campos,
    normalização de CNPJ/Telefone e hash de dados PII para conformidade com a LGPD.
    Fonte de verdade inicial do DW.
  columns:
  - name: id_vendedor
    description: Chave primária (Primary Key) que identifica univocamente o registro
      na tabela stg_erp_b_vendedor.
    tests:
    - unique
    - not_null
  - name: nome
    description: Nome ou Razão Social associado ao registro.
    meta:
      contains_pii: true
      classification: Restricted
  - name: email
    description: Endereço de e-mail corporativo ou de contato. Hash aplicado para
      conformidade com LGPD.
    meta:
      contains_pii: true
      classification: Restricted
  - name: regiao
    description: Campo regiao importado da origem stg_erp_b_vendedor.
  - name: ativo
    description: Campo ativo importado da origem stg_erp_b_vendedor.
  meta:
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
