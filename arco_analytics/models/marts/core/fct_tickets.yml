    description: ID do ticket. Chave primária.
    tests:
    - unique
    - not_null
  - name: id_cliente
    description: CNPJ fallback da organização que abriu o ticket.
  - name: status
    description: Status da solicitação.
  - name: created_at
    description: Abertura.
  - name: solved_at
    description: Resolução.
  meta:
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
    join_logic: Chamados de suporte. FK_organization = id_escola (via CNPJ).
    business_rules: Sem regras complexas documentadas.
