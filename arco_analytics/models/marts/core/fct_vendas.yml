version: 2
models:
- name: fct_vendas
  description: 'Fato Vendas (Cabeçalho/Header). Evita fan-out mantendo granularidade
    de pedido (1 linha = 1 pedido). Regra de Negócio: Pedidos CANCELADOS na origem
    ERP A (5 registros) não possuem amarração de itens na tabela de detalhe (fct_vendas_itens),
    gerando órfãos intencionais. Isso não configura perda de dados, mas sim um padrão
    transacional de rascunhos (Drafts).'
  columns:
  - name: id_pedido
    description: SK do pedido prefixado com origem. Chave primária.
    tests:
    - unique
    - not_null
  - name: id_cliente
    description: CNPJ do cliente. Chave estrangeira para dim_escolas.
    tests:
    - relationships:
        to: ref('dim_escolas')
        field: id_escola
  - name: data_pedido
    description: Data de emissão do pedido.
  - name: id_vendedor_sk
    description: SK do vendedor. Chave estrangeira para dim_vendedores.
    tests:
    - relationships:
        to: ref('dim_vendedores')
        field: id_vendedor_sk
  - name: status_pedido
    description: Status normalizado do pedido.
    tests:
    - accepted_values:
        values:
        - PENDING
        - IN_PROGRESS
        - CANCELLED
        - DELIVERED
  - name: is_cancelado
    description: Flag indicando cancelamento.
  - name: sistema_origem
    description: Sistema (ERP A ou ERP B).
  meta:
    summary: 'Modelo de dados para fct_vendas'
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
    join_logic: Pedidos de vendas. FK_cliente = id_escola (via CNPJ). FK_vendedor
      = id_vendedor_sk.
    business_rules: Pedidos órfãos do ERP A são intencionais (Drafts).
    grain: 1 linha = 1 pedido
    domain: Vendas
    update_frequency: Diário
    governance: Silver Certified
  config:
    tags:
    - core
    - vendas
