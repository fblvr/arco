version: 2
models:
  - name: NOME_DO_MODELO
    description: "Descrição corporativa clara da funcionalidade ou da tabela de dados bruto."
    meta:
      owner: "@data_engineering_team"
      business_context: "Descreva a regra de negócio aplicada ou a lógica de junção deste modelo."
      changelog:
        - date: "YYYY-MM-DD"
          author: "Debugger-Global ou Nome"
          changes: "Criação inicial do modelo."
    columns:
      - name: nome_da_chave_primaria
        description: "Chave primária."
        tests:
          - unique
          - not_null
      - name: coluna_pii_exemplo
        description: "Exemplo de coluna que contém dados sensíveis (email, nome, documento, telefone)."
        meta:
          contains_pii: true
          classification: Restricted
      - name: coluna_metrica
        description: "Coluna comum."
