version: 2
models:
- name: fct_vendas_itens
  description: Fato Vendas (Detalhes/Itens). Traz a granularidade de produtos comprados.
  columns:
  - name: id_item_pedido
    description: SK do item do pedido. Chave primária.
    tests:
    - unique
    - not_null
  - name: id_pedido
    description: SK do pedido pai.
    tests:
    - relationships:
        to: ref('fct_vendas')
        field: id_pedido
  - name: id_produto_origem
    description: Código do produto no sistema fonte.
  - name: qtd_pedida
    description: Quantidade adquirida.
  - name: valor_total
    description: Receita bruta do item.
  - name: sistema_origem
    description: Sistema (ERP A ou ERP B).
  - name: id_produto_unificado
    description: Surrogate key unificada do produto.
    tests:
    - relationships:
        to: ref('dim_produtos')
        field: id_produto_unificado
  meta:
    summary: 'Modelo de dados para fct_vendas_itens'
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
    join_logic: Itens do pedido. FK_produto = id_produto_unificado (hash do nome).
      FK_pedido = id_pedido.
    business_rules: Sem regras complexas documentadas.
