version: 2
models:
- name: stg_crm_product
  description: Modelo staging da tabela stg_crm_product. Contém limpeza de campos,
    normalização de CNPJ/Telefone e hash de dados PII para conformidade com a LGPD.
    Fonte de verdade inicial do DW.
  columns:
  - name: id
    description: Chave primária (Primary Key) que identifica univocamente o registro
      na tabela stg_crm_product.
    tests:
    - not_null
    - unique
  - name: productcode
    description: Campo productcode importado da origem stg_crm_product.
  - name: name
    description: Nome ou Razão Social associado ao registro.
    meta:
      contains_pii: true
      classification: Restricted
  - name: brand__c
    description: Campo brand__c importado da origem stg_crm_product.
  - name: materialtype__c
    description: Campo materialtype__c importado da origem stg_crm_product.
  - name: isactive
    description: Campo isactive importado da origem stg_crm_product.
  - name: createddate
    description: Data/Carimbo de tempo (Timestamp) referenciando a criação ou atualização
      do evento.
  meta:
    summary: 'Modelo de dados para stg_crm_product'
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
