version: 2
models:
- name: dim_usuarios
  description: Usuários dos sistemas CRM e Support.
  columns:
  - name: id_usuario_sk
    description: Surrogate Key (Sistema + ID). Chave primária.
    tests:
    - unique
    - not_null
  - name: id_usuario_sistema
    description: ID original no sistema.
  - name: nome_usuario
    description: Nome do usuário.
    meta:
      contains_pii: true
      classification: Restricted
  - name: email
    description: Email hasheado.
    meta:
      contains_pii: true
      classification: Restricted
  - name: sistema_origem
    description: Sistema (CRM ou Support).
  meta:
    summary: 'Modelo de dados para dim_usuarios'
    owner: '@data_engineering_team'
    business_context: Domínio de dados corporativo da Arco Educação.
    changelog:
    - date: '2026-08-27'
      author: Debugger-Global
      changes: Enriquecimento massivo de metadados PII e Data Quality.
    join_logic: Surrogate Key = MD5(sistema_origem + id_usuario_sistema).
    business_rules: Sem regras complexas documentadas.
